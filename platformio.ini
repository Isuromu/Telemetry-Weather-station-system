; PlatformIO Project Configuration File
; IMPORTANT RULES:
; - Keep this file stable. Do NOT rewrite it every time.
; - When you need a new external library, ONLY append it under lib_deps.
; - All comments are intentionally in English (as requested).

[platformio]
default_envs = station_water
boards_dir = boards

; ---------------------------
; Common settings (shared)
; ---------------------------
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_extra_dirs = lib/Sensors

build_flags =
  ; Local include paths for IntelliSense and config structure
  -I lib/PrintController/src
  -I lib/RS485ModBus/src
  -I lib/Sensors
  -I config
  -I pcb

  ; Optional global debug placeholder
  -D DEBUG_MODE_DEFAULT=0

lib_deps =
  ; Add external libs here ONLY when needed (append new lines)
  ; Example:
  ; frankboesing/FastCRC@^1.41
  knolleary/PubSubClient@^2.8

; ---------------------------
; ESP32-S3 GEN4 (main target)
; This project targets PCB_ESP32S3_V2 only.
; ---------------------------
[env:gen4_esp32s3_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
upload_speed = 921600
monitor_speed = 115200

; ---------------------------
; Station / PCB profile
; ---------------------------
; Every firmware/example env below extends this ESP32-S3 V2 profile.

[env:station_esp32s3_v2]
extends = env:gen4_esp32s3_r8n16
build_flags =
  ${env.build_flags}

; ---------------------------
; Station profile: Water sensors -> topic-1
; ---------------------------
[env:station_water]
extends = env:station_esp32s3_v2
build_flags =
  ${env:station_esp32s3_v2.build_flags}
  -D TELEMETRY_STATION_PROFILE_WATER=1

; ---------------------------
; Station profile: Soil and weather/air sensors -> topic-2
; ---------------------------
[env:station_soil_air]
extends = env:station_esp32s3_v2
build_flags =
  ${env:station_esp32s3_v2.build_flags}
  -D TELEMETRY_STATION_PROFILE_SOIL_AIR=1

; ---------------------------
; Station profile: Gas and pollution sensors -> topic-3
; ---------------------------
[env:station_gas_pollution]
extends = env:station_esp32s3_v2
build_flags =
  ${env:station_esp32s3_v2.build_flags}
  -D TELEMETRY_STATION_PROFILE_GAS_POLLUTION=1

