; IrrigationAutomationFirmware - PIOArduino configuration

[platformio]
default_envs = esp32_wroom32d

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = chain+
build_flags =
  -I .
  -I include
  -I config
  -D DEBUG_MODBUS=0
  -D ENABLE_DANGEROUS_RAW_WRITES=0

[env:esp32_wroom32d]
; PIOArduino 55.03.311 = Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
upload_speed = 921600
build_flags =
  ${env.build_flags}
  -D ACTIVE_BOARD=BOARD_ESP32_WROOM32D
  -D ACTIVE_INVERTER=INVERTER_DELIXI_E100G2R2T4B
  -D ACTIVE_MOTOR=MOTOR_GRANDFAR_2CP50_160B

[env:pump_control]
extends = env:esp32_wroom32d
build_src_filter =
  -<*>
  +<../examples/PumpControl/src/>
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -I examples/PumpControl/include
lib_deps =
  jgromes/RadioLib @ 7.7.1

[pcv_common]
extends = env:esp32_wroom32d
build_src_filter =
  -<*>
  +<../examples/PressureControlNode/src/>
lib_deps =
  jgromes/RadioLib @ 7.7.1

[env:pcv_serial_only]
extends = pcv_common
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -D PRESSURE_NODE_RUNTIME_MODE=PCV_RUNTIME_SERIAL_ONLY

[env:pcv_hybrid_class_c]
extends = pcv_common
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -D PRESSURE_NODE_RUNTIME_MODE=PCV_RUNTIME_HYBRID_CLASS_C

[env:pcv_low_power_class_a]
extends = pcv_common
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -I examples/PressureControlNode/src
  -I examples/PressureControlNode/include
  ; Hardware values for valve_1 live in
  ; examples/PressureControlNode/include/PressureNodeConfig.h.
  -D PRESSURE_NODE_RUNTIME_MODE=PCV_RUNTIME_LOW_POWER_CLASS_A
  ; Commissioning only: restore both values to 60 or more before deployment.
  -D PCV_LORAWAN_DEFAULT_INTERVAL_SECONDS=10
  -D PCV_LORAWAN_MIN_INTERVAL_SECONDS=10


[env:pcv_low_power_class_a_without_flowmeter]
extends = pcv_common
build_src_filter =
  -<*>
  +<../examples/PressureControlNode2/src/main.cpp>
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -I examples/PressureControlNode2/src
  -I examples/PressureControlNode2/include
  -D PRESSURE_NODE_RUNTIME_MODE=PCV_RUNTIME_LOW_POWER_CLASS_A
  ; Hardware values for valve_2 live in
  ; examples/PressureControlNode2/include/PressureNode2Config.h.
  -D PCV_NO_FLOW_METER=1
  -D PCV_NO_FLOW_ACTUATION_ENABLED=1

[env:pcv_solar_test]
extends = pcv_common
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -I examples/PressureControlNode/include
  -D PRESSURE_NODE_RUNTIME_MODE=PCV_RUNTIME_SERIAL_ONLY
  ; Bench build for the EPEVER LandStar LS1024B. The node's single RS-485 branch
  ; goes to the solar controller at 115200, so the 9600-baud TUF-2000M is
  ; compiled out. See docs/EPEVER_LS1024B.md.
  -D PCV_SOLAR_TEST=1
  -D PCV_NO_FLOW_METER=1
  ; Charge-setting writes are off by default in every other build. This target
  ; enables them for the bench session; each write is still read back.
  -D SOLAR_CONTROLLER_WRITES_ENABLED=1

[env:pcv_solar_test_readonly]
extends = pcv_common
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -I examples/PressureControlNode/include
  -D PRESSURE_NODE_RUNTIME_MODE=PCV_RUNTIME_SERIAL_ONLY
  -D PCV_SOLAR_TEST=1
  -D PCV_NO_FLOW_METER=1
  ; Measurements, the settings block, raw register reads, and the find-ID frame
  ; stay available; charge-setting writes and the address change are compiled
  ; out. Used to confirm the write gate before trusting the writable build.

[env:water_level]
extends = env:esp32_wroom32d
build_src_filter =
  -<*>
  +<../examples/WaterLevel/src/>
build_flags =
  ${env:esp32_wroom32d.build_flags}
;  -D WATER_LEVEL_SLEEP_SECONDS=900
lib_deps =
  jgromes/RadioLib @ 7.7.1

[env:soil_node]
extends = env:esp32_wroom32d
build_src_filter =
  -<*>
  +<../examples/SoilNode/src/>
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -I examples/SoilNode/include
lib_deps =
  jgromes/RadioLib @ 7.7.1
  adafruit/Adafruit ADS1X15 @ ^2.5.0

[env:main_valve]
extends = env:esp32_wroom32d
build_src_filter =
  -<*>
  +<../examples/MainValve/src/>
build_flags =
  ${env:esp32_wroom32d.build_flags}
  -I examples/MainValve/include
lib_deps =
  jgromes/RadioLib @ 7.7.1


[env:protocol_compile_tests]
extends = env:esp32_wroom32d
test_framework = unity
test_filter = test_protocol
test_build_src = no

[env:pressure_logic_compile_tests]
extends = env:esp32_wroom32d
test_framework = unity
test_filter = test_pressure_logic
test_build_src = no
