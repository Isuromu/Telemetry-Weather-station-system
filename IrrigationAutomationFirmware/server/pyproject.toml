[project]
name = "irrigation-server"
version = "0.1.0"
description = "Local irrigation server for approved watering plans"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "influxdb-client==1.50.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
