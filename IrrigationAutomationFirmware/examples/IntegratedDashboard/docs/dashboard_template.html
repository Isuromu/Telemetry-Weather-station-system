<template>
  <div class="irrigation-dashboard">
    <header class="ir-header">
      <div>
        <div class="ir-eyebrow">FIELD CONTROL</div>
        <h1>Irrigation control</h1>
        <p>Reservoir, soil, valves and pump in one view</p>
      </div>
      <div class="ir-header-status">
        <span class="ir-chip" :class="phaseClass">{{ phaseLabel }}</span>
        <span class="ir-chip ir-mqtt" :class="mqttClass"><i></i>MQTT {{ mqttLabel }}</span>
      </div>
    </header>

    <div class="ir-banner" :class="state.phase === 'running' ? 'ir-banner-running' : state.check ? 'ir-banner-blocked' : 'ir-banner-ready'" role="status">
      <span class="ir-banner-symbol">{{ state.phase === 'running' ? '●' : state.check ? '!' : '✓' }}</span>
      <div>
        <strong>{{ state.phase === 'running' ? 'Watering in progress' : state.check ? 'Start blocked' : 'Ready to water' }}</strong>
        <span>{{ state.phase === 'running' ? (state.notice || 'Monitoring safety conditions') : state.check || state.notice || 'All required checks passed' }}</span>
      </div>
    </div>

    <div class="ir-grid">
      <article v-for="(d,k) in cards" :key="k" class="ir-card" :class="cardClass(k,d)">
        <div class="ir-card-top">
          <div class="ir-card-title"><span class="ir-icon" :class="'ir-icon-' + k">{{ icons[k] }}</span><b>{{ names[k] }}</b></div>
          <div class="ir-card-actions">
            <button v-if="k === 'pump'" class="ir-refresh" :class="{'ir-refresh-spinning':pumpRefreshing}" :disabled="pumpRefreshing || pumpCooldown > 0" :title="pumpRefreshTitle" aria-label="Refresh Pump status" @click="requestPumpStatus">&#8635;</button>
            <span class="ir-state" :class="statusClass(k,d)">{{ statusLabel(k,d) }}</span>
          </div>
        </div>
        <div class="ir-reading">{{ cardValue(k,d) }}</div>
        <div class="ir-card-detail">{{ detail(k,d) }}</div>
        <div v-if="k === 'pump' && pumpDiagnostic(d)" class="ir-pump-diagnostic">{{ pumpDiagnostic(d) }}</div>
        <div class="ir-card-footer"><span>{{ secondary(k,d) }}</span><time>{{ seen(d) }}</time></div>
      </article>
    </div>

    <section class="ir-panel ir-control-panel">
      <div class="ir-panel-heading"><div><h2>Watering zones</h2><p>Select one half of the field or both.</p></div><span class="ir-small-tag">OPERATOR CONTROL</span></div>
      <div class="ir-control-row">
        <div class="ir-zone-options">
          <label><input type="checkbox" v-model="valve1"><span><b>Half 1</b><small>valve_1</small></span></label>
          <label><input type="checkbox" v-model="valve2"><span><b>Half 2</b><small>valve_2</small></span></label>
        </div>
        <div class="ir-buttons">
          <button class="ir-start" :disabled="state.phase !== 'idle' || !state.configured || !!state.check" @pointerdown="showRipple" @click="start($event)"><span class="ir-button-label">Start watering</span></button>
          <button class="ir-stop" @pointerdown="showRipple" @click="stop($event)"><span class="ir-button-label">Stop watering</span></button>
        </div>
      </div>
      <p class="ir-sequence">Shutdown order: stop pump → close selected field valves → close main valve.</p>
    </section>

    <section class="ir-panel ir-limits-panel">
      <div class="ir-panel-heading"><div><h2>Safety limits</h2><p>Editable in the Irrigation settings function node.</p></div><span class="ir-small-tag">CURRENT SETTINGS</span></div>
      <div class="ir-limits">
        <span>Reservoir start <b>≥ {{ settings.startLevelCm }} cm</b></span>
        <span>Reservoir stop <b>≤ {{ settings.stopLevelCm }} cm</b></span>
        <span>Soil start <b>&lt; {{ settings.startMoisturePercent }}%</b></span>
        <span>Soil stop <b>≥ {{ settings.stopMoisturePercent }}%</b></span>
        <span>Main valve open <b>{{ settings.mainOpenMinDeg }}–{{ settings.mainOpenMaxDeg }}°</b></span>
      </div>
      <p class="ir-footnote">Field-valve position is the last commanded state; physical position is not verified by current telemetry.</p>
    </section>
  </div>
</template>

<script>
export default {
  data() {
    return {
      state: {phase:'idle',devices:{}}, valve1:true, valve2:true, now:Date.now(), timer:null,
      names: {water:'Reservoir',soil:'Soil',main:'Main valve',valve1:'Valve 1',valve2:'Valve 2',pump:'Pump'},
      icons: {water:'💧',soil:'🌱',main:'⚙',valve1:'↔',valve2:'↔',pump:'◉'}
    }
  },
  computed: {
    settings() { return this.state.settings || {} },
    cards() { return Object.fromEntries(Object.keys(this.names).map(k => [k,this.state.devices?.[k] || {stale:true}])) },
    phaseLabel() { return String(this.state.phase || 'idle').replace(/_/g,' ').toUpperCase() },
    phaseClass() { return this.state.phase === 'running' ? 'ir-phase-running' : this.state.phase === 'fault' ? 'ir-phase-fault' : 'ir-phase-idle' },
    mqttLabel() { const t=String(this.state.mqtt_status||'').toLowerCase(); return t.includes('disconnected') ? 'disconnected' : t.includes('connected') ? 'connected' : t.includes('connecting') ? 'connecting' : 'unknown' },
    mqttClass() { return 'ir-mqtt-' + this.mqttLabel },
    pumpRefreshing() { return !!this.state.pumpRefresh?.pending && this.now-Number(this.state.pumpRefresh?.requestedAt||0)<30000 },
    pumpCooldown() { return Math.max(0,Math.ceil((Number(this.state.pumpRefresh?.requestedAt||0)+10000-this.now)/1000)) },
    pumpRefreshTitle() { return this.pumpRefreshing ? 'Requesting Pump status' : this.pumpCooldown ? `Refresh available in ${this.pumpCooldown} s` : 'Refresh Pump status' }
  },
  watch: {msg: {handler(m) { if (m?.payload?.kind === 'state') this.state = m.payload.state || {phase:'idle',devices:{}} }, immediate:true}},
  mounted() { this.timer=setInterval(()=>{this.now=Date.now()},500) },
  beforeUnmount() { if(this.timer)clearInterval(this.timer) },
  methods: {
    fmt(v,suffix='') { return typeof v === 'number' && Number.isFinite(v) ? v.toFixed(1) + suffix : '—' },
    invalid(k,d) {
      return (k === 'water' && d.pressure_valid !== true) ||
        (k === 'soil' && d.sensor_valid !== true) ||
        (k === 'main' && (d.actuator_online !== true || (typeof d.actuator_fault_code === 'number' && d.actuator_fault_code !== 0))) ||
        (k === 'pump' && (d.communication_ok !== true || d.configuration_valid !== true || (typeof d.vfd_fault_code === 'number' && d.vfd_fault_code !== 0)));
    },
    statusLabel(k,d) { return !d.last_seen ? 'NO DATA' : d.stale ? 'STALE' : this.invalid(k,d) ? 'FAULT' : 'LIVE' },
    statusClass(k,d) { return !d.last_seen ? 'ir-no-data' : d.stale ? 'ir-stale' : this.invalid(k,d) ? 'ir-fault' : 'ir-live' },
    cardClass(k,d) { return !d.last_seen ? 'ir-card-empty' : d.stale ? 'ir-card-stale' : this.invalid(k,d) ? 'ir-card-fault' : 'ir-card-live' },
    cardValue(k,d) {
      if (!d.last_seen) return 'Waiting for uplink';
      if (k === 'water') return this.fmt(typeof d.depth_m === 'number' ? d.depth_m * 100 : null,' cm');
      if (k === 'soil') return this.fmt(d.vwc_percent,'%');
      if (k === 'main') return this.fmt(d.actual_angle_deg,'°');
      if (k === 'pump') return d.stale ? 'UNKNOWN' : d.running === true ? 'RUNNING' : d.running === false ? 'STOPPED' : 'UNKNOWN';
      return (d.pcv_last_commanded || 'UNKNOWN').toUpperCase();
    },
    detail(k,d) {
      if (!d.last_seen) return 'No device report received';
      if (k === 'water') return d.pressure_valid ? 'Level sensor valid' : 'Level sensor invalid';
      if (k === 'soil') return d.sensor_valid ? 'Moisture sensor valid' : 'Moisture sensor invalid';
      if (k === 'main') return `Actuator ${d.actuator_online === true ? 'online' : 'offline'} · ${d.valve_moving ? 'moving' : 'stopped'}`;
      if (k === 'pump') return d.stale ? 'VFD and radio status unavailable' : `VFD link ${d.communication_ok === true ? 'OK' : 'fault'} · ${this.fmt(d.actual_frequency_hz,' Hz')}`;
      return d.pcv_position_verified ? 'Physical position verified' : 'Physical position unverified';
    },
    secondary(k,d) {
      if (!d.last_seen) return 'Awaiting telemetry';
      if (k === 'main') return `Fault: ${d.actuator_fault_code ?? '—'}`;
      if (k === 'pump') return d.stale ? 'Cached health values hidden' : `${d.class_c_active ? 'Class C active' : d.lorawan_active ? 'LoRaWAN active' : 'Join not confirmed'} · Fault: ${d.vfd_fault_code ?? '—'}`;
      if (k === 'valve1' || k === 'valve2') return `Command ID: ${d.last_command_id ?? '—'}`;
      return d.stale ? 'Reading too old for control' : 'Reading available';
    },
    seen(d) {
      if (!d.last_seen) return 'Never seen';
      const date=new Date(d.last_seen);
      if (Number.isNaN(date.getTime())) return 'Time unknown';
      const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(date);
      const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));
      return `${p.day}/${p.month}/${p.year} ${p.hour}:${p.minute}:${p.second}`;
    },
    pumpDiagnostic(d) {
      if (d.stale) return this.state.pumpRefresh?.result || '';
      if (d.command_result === 'in_progress') return `Command ${d.last_command_id ?? '—'} in progress; waiting for final VFD condition`;
      if (typeof d.previous_join_error_code === 'number' && d.previous_join_error_code !== 0) return `Joined after ${d.join_attempt_count ?? '—'} attempts · previous error ${d.previous_join_error_code} · retry ${d.previous_join_retry_seconds ?? '—'} s`;
      return this.state.pumpRefresh?.result || '';
    },
    requestPumpStatus() {
      if (this.pumpRefreshing || this.pumpCooldown) return;
      this.send({payload:{kind:'refresh_pump'}});
    },
    showRipple(event) {
      const button = event.currentTarget;
      if (button.disabled || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const rect = button.getBoundingClientRect();
      const size = Math.hypot(rect.width, rect.height) * 2;
      const ripple = document.createElement('span');
      ripple.className = 'ir-ripple';
      Object.assign(ripple.style, {
        position: 'absolute', zIndex: '0', borderRadius: '50%',
        background: 'rgba(255,255,255,.38)', pointerEvents: 'none', animation: 'none'
      });
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${(event.clientX || rect.left + rect.width / 2) - rect.left - size / 2}px`;
      ripple.style.top = `${(event.clientY || rect.top + rect.height / 2) - rect.top - size / 2}px`;
      button.appendChild(ripple);
      ripple.animate([
        {transform:'scale(0)',opacity:1},
        {transform:'scale(1)',opacity:0}
      ], {duration:550,easing:'ease-out'}).onfinish = () => ripple.remove();
    },
    start(event) {
      if (event.detail === 0) this.showRipple(event);
      if (!this.valve1 && !this.valve2) return;
      window.setTimeout(() => {
        if (!window.confirm('Start watering selected zones?')) return;
        this.send({payload:{kind:'start',valve1:this.valve1,valve2:this.valve2}});
      }, 100);
    },
    stop(event) {
      if (event.detail === 0) this.showRipple(event);
      this.send({payload:{kind:'stop'}});
    }
  }
}
</script>

.ir-limits{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.ir-limits span{border:1px solid #dfe9ef;background:#f6f9fb;border-radius:8px;padding:9px 11px;font-size:12px;color:#5b7382}.ir-limits b{color:#1d4359}

</style>
